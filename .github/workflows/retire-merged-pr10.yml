name: Retire merged PR 10 branch once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-merged-pr10.yml

permissions:
  contents: write

jobs:
  retire:
    if: github.repository == 'Fuck-GH-Admin/comfyui-gpt-image-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate lease and delete merged source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=fix/partial-batch-failure-evidence-20261107
          expected=3d44538d80eedf7ab0642c587097a03e1294e8c0
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Branch head changed; leaving it untouched." >&2
            exit 1
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          echo "Retired exact merged PR branch: ${branch}"
