name: Retire reviewed merged branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-merged-branches.yml

permissions:
  contents: write

jobs:
  retire:
    if: github.repository == 'Fuck-GH-Admin/comfyui-gpt-image-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only reviewed branches at pinned heads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            'docs/cliproxyapi-capability-boundaries-20261106|cd14877ba33a5c3988da3c97aff66e35c94f42d0'
            'docs/live-alpha-retest-20261106|60eb6bcc008aea1c4fbf51f7c877173b1c7395b8'
            'feat/local-image-export-20261106|357dbaa87e9729ba64114ca3e6a1547f10651d70'
            'feat/verify-image-output-contract-20261106|f7dd9d82c6bfe547c73f4c0a5f7a5727b2643679'
            'fix/main-acceptance-regressions-20261106|61e93feec1b7a2924e705e0febfbd59ab62b49fb'
            'fix/preserve-alpha-output-20261106|26b35d6a9f9c26e559e4a188d38c7faaf8e69701'
          )
          # Abort without deleting anything if any branch moved.
          for entry in "${expected[@]}"; do
            branch="${entry%%|*}"
            wanted="${entry##*|}"
            actual="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$actual" != "$wanted" ]]; then
              echo "::error::Branch $branch changed; refusing cleanup."
              exit 1
            fi
          done
          for entry in "${expected[@]}"; do
            branch="${entry%%|*}"
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
            echo "Retired $branch"
          done
          echo 'Six reviewed branch refs retired.'
