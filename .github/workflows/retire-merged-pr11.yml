name: Retire merged PR 11 source branch once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-merged-pr11.yml

permissions:
  contents: write

jobs:
  retire:
    if: github.repository == 'Fuck-GH-Admin/comfyui-gpt-image-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify merged PR and exact source SHA before deleting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=feat/server-side-provider-profiles-20261107
          expected=23ab9ad2ce0221feec4ab5afdf167b48d4468d8c
          merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/11" --jq '.merged')"
          test "$merged" = true
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Source branch moved; refusing to delete it." >&2
            exit 1
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          echo "Retired exact merged PR #11 branch."
