name: Retire merged native-refactor source branches once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-merged-native-refactor-branches.yml

permissions:
  contents: write

jobs:
  retire:
    if: github.repository == 'Fuck-GH-Admin/comfyui-gpt-image-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify both PRs and delete only expected source refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pr in 14 15; do
            merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.merged')"
            test "$merged" = "true"
          done
          branches=(
            "fix/discoverable-lossless-edit-references-20261108"
            "refactor/native-advanced-visibility-20261108"
          )
          expected=(
            "55440db7b4a7fa2241695efa97d593009b73ce08"
            "3966e18aef42c8cea9e0339d18b76680a4a61128"
          )
          for i in 0 1; do
            actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branches[i]}" --jq '.object.sha')"
            if [[ "${actual}" != "${expected[i]}" ]]; then
              echo "Ref moved: ${branches[i]}; refusing cleanup" >&2
              exit 1
            fi
          done
          for i in 0 1; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branches[i]}"
          done
          echo "Retired both exact merged source branches."
